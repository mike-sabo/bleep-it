<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      width: 280px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider {
      background-color: #4caf50;
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    /* Mode buttons */
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }

    .mode-btn {
      padding: 10px 8px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: none;
      font-size: 12px;
    }

    .mode-btn:hover {
      border-color: #aaa;
    }

    .mode-btn.active {
      border-color: #4caf50;
      background: #f0faf0;
    }

    .mode-btn .icon {
      font-size: 18px;
      display: block;
      margin-bottom: 2px;
    }

    .mode-btn .label {
      font-weight: 600;
    }

    /* Site row */
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: #f7f7f7;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .site-row .site-info {
      min-width: 0;
      flex: 1;
    }

    .site-row .site-host {
      font-weight: 600;
      font-size: 12px;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-row .site-desc {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .site-row .switch {
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .site-row .switch input:checked + .slider::before {
      transform: translateX(16px);
    }

    .site-row .slider::before {
      height: 14px;
      width: 14px;
    }

    /* Footer link */
    .footer {
      border-top: 1px solid #eee;
      padding-top: 10px;
      text-align: center;
    }

    .footer a {
      color: #4caf50;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bleep It!</h1>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-label">Censoring Mode</div>
  <div class="modes">
    <button class="mode-btn active" data-mode="blur">
      <span class="icon">🌫️</span>
      <span class="label">Blur</span>
    </button>
    <button class="mode-btn" data-mode="hide">
      <span class="icon">🚫</span>
      <span class="label">Hide</span>
    </button>
    <button class="mode-btn" data-mode="symbols">
      <span class="icon">#@!</span>
      <span class="label">Symbols</span>
    </button>
    <button class="mode-btn" data-mode="silly">
      <span class="icon">🤪</span>
      <span class="label">Silly</span>
    </button>
  </div>

  <div class="site-row" id="site-row" hidden>
    <div class="site-info">
      <div class="site-host" id="site-host"></div>
      <div class="site-desc">Run Bleep It! on this site</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="site-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    <a href="#" id="open-options">Manage custom word list →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
